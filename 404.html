<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面不存在 · Daymark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f6f3;
      color: #1c1b19;
      font-family: "Manrope", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 460px;
      width: 100%;
      background: #fff;
      border: 1px solid #e8e5df;
      border-radius: 18px;
      padding: 40px 36px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(28, 27, 25, .07);
    }
    .code {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      color: #1c1b19;
    }
    h1 {
      font-size: 17px;
      font-weight: 700;
      margin: 18px 0 10px;
    }
    p {
      font-size: 14px;
      line-height: 1.7;
      color: #6f6b64;
      margin: 0 0 24px;
    }
    a.btn {
      display: inline-block;
      padding: 11px 22px;
      border-radius: 10px;
      background: #1c1b19;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity .18s ease;
    }
    a.btn:hover { opacity: .82; }
    .hint { margin-top: 20px; font-size: 12px; color: #a5a099; }
  </style>
  <script>
    // GitHub Pages 路径区分大小写，且写错子路径会落到这里。
    // 统一跳回站点根目录，避免访客卡在 404 页面。
    (function () {
      var target = "/daymark/";
      setTimeout(function () {
        if (location.pathname !== target) location.replace(target);
      }, 1200);
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>这个地址没有对应的页面</h1>
    <p>可能链接拼写有误，或路径大小写不一致（GitHub Pages 的路径是区分大小写的）。正在带你回到 Daymark 首页…</p>
    <a class="btn" href="/daymark/">立即前往首页</a>
    <div class="hint">正确地址：https://kaye-star.github.io/daymark/</div>
  </div>
</body>
</html>
